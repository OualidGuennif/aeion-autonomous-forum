# Agora forum: Quarkus on Java 25, Hibernate over a PostgreSQL database deployed separately.
# Feature 002: PostgreSQL is the only product database. The migration owner is a separate role
# used only by the isolated operator JVM (local.aeion.forum.DatabaseOperator); the application
# runs as a least-privileged app role that validates the schema and never migrates it.
# Feature 001: a deployment boots database-less by default. With only a session secret preset it
# carries no datasource and no Hibernate, and GET /healthz runs without a database connection.

quarkus.application.name=agora-forum
aeion.release=${AEION_RELEASE:unreleased}
quarkus.http.port=${AEION_FORUM_PORT:8081}
quarkus.http.host=127.0.0.1

# --- The forum's web face (React Native for web) --------------------------------------------
# The same client runs in a browser on the Expo dev server; that origin is allowed, with the
# session cookie, and nothing else. The browser owns the cookie and sends it on every call.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://127.0.0.1:8082,http://localhost:8082
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=content-type,accept,x-csrf-token

# --- Settings (feature 001) ----------------------------------------------------------------
# A deployment without a real secret refuses to start (SessionSecret names only the key).
# The value comes from the environment; it is never written to a file, a log or a page.
agora.session.secret=${AGORA_SESSION_SECRET:}
# Database-backed features are opt-in: absent or false boots database-less, with no datasource,
# no ORM and no migrations; true restores the database-backed behaviour, and then requires a
# datasource URL (AgoraSettings refuses startup naming only the keys when it is missing).
agora.database.enabled=${AGORA_DATABASE_ENABLED:false}
quarkus.datasource.active=${agora.database.enabled}
quarkus.hibernate-orm.active=${agora.database.enabled}
# Bounded caps, validated by AgoraSettings at boot: a non-numeric or out-of-range value refuses
# the start naming only the key, and an absent key takes the documented default.
agora.request.max-bytes=${AGORA_REQUEST_MAX_BYTES:}
agora.text.max-codepoints=${AGORA_TEXT_MAX_CODEPOINTS:}
agora.rendered.max-bytes=${AGORA_RENDERED_MAX_BYTES:}
# The business timezone: the process default zone is pinned at startup, so a deployment never
# inherits the clock zone of whatever container hosts it.
agora.time-zone=Europe/Paris
# Request body cap: a 16 KiB ceiling, refused as 413 before any handler runs.
quarkus.http.limits.max-body-size=16K

# --- PostgreSQL (feature 002) ---------------------------------------------------------------
# The connection settings arrive only through the environment and are never written to a file,
# a log or a page. A database-enabled boot without a URL refuses (AgoraSettings). Remote hosts
# must use sslmode=verify-full; only an isolated local transport may omit TLS (DatabaseTls).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:}
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=10s

quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.schema-management.strategy=none

# --- Migrations -----------------------------------------------------------------------------
# Flyway is the single versioned migration authority (feature 002). The operator JVM migrates as
# the migration owner; the application only validates at startup, so migrate-at-start stays off.
quarkus.flyway.active=${agora.database.enabled}
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=classpath:db/migration

# --- Kafka (feature 011) --------------------------------------------------------------------
# Off by default: a deployment without a broker must still serve readers, and its events wait in the
# outbox. With AEION_KAFKA_ENABLED=true the publisher drains the outbox and the consumer subscribes;
# both use the plain clients, so no connector has to exist for a unit run.
agora.kafka.enabled=${AEION_KAFKA_ENABLED:false}
agora.kafka.bootstrap.servers=${AEION_KAFKA:127.0.0.1:9092}
agora.kafka.topic=agora.threads
agora.kafka.group=agora-forum

%test.quarkus.scheduler.enabled=false
# An ephemeral port keeps a suite from colliding with a forum a human is running.
%test.quarkus.http.test-port=0
# Feature 001: unit tests run database-backed on the ephemeral resource; the database-less
# QuarkusTestProfile overrides both this key and its unqualified form with false.
%test.agora.database.enabled=true

quarkus.log.category."local.aeion".level=INFO
