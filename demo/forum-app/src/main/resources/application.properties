# Agora forum: Quarkus on Java 25, Hibernate over a SQLite database that is deployed separately.
# The database file is owned by the sqlite service (demo/forum-db); the application only opens it
# through a URL that keeps WAL and a busy timeout, never by copying it. The database-backed
# features are off unless AGORA_DATABASE_ENABLED asks for them, so the skeleton also boots with
# no database at all.

quarkus.application.name=agora-forum
aeion.release=${AEION_RELEASE:unreleased}
# The port the forum listens on. 8080 is the default the acceptance contract addresses; the
# environment key still wins, and the local Compose demo sets QUARKUS_HTTP_PORT=8081 explicitly.
quarkus.http.port=${AEION_FORUM_PORT:8080}
quarkus.http.host=127.0.0.1

# --- The forum's web face (React Native for web) --------------------------------------------
# The same client runs in a browser on the Expo dev server; that origin is allowed, with the
# session cookie, and nothing else. The browser owns the cookie and sends it on every call.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://127.0.0.1:8082,http://localhost:8082
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=content-type,accept,x-csrf-token

# --- Settings (feature 001) ----------------------------------------------------------------
# A deployment without a real secret refuses to start (SessionSecret names only the key).
# The value comes from the environment; it is never written to a file, a log or a page.
agora.session.secret=${AGORA_SESSION_SECRET:}
# Request body cap: a 16 KiB ceiling, refused as 413 before any handler runs.
quarkus.http.limits.max-body-size=16K

# --- Typed configuration (feature 001) ------------------------------------------------------
# Every key below has a bounded default and a refusal: a value that is not a number, or is
# outside its range, stops the start and names the key it refused. No value is ever logged or
# rendered, and an environment variable nobody reads is ignored.
#
# The database-backed features are off unless a deployment asks for them: without them the
# application serves liveness, applies no migration and opens no connection.
agora.database.enabled=${AGORA_DATABASE_ENABLED:false}
# The request body ceiling in bytes: 1..16384, 16384 by default. It may lower the ceiling, never
# raise it above the documented 16 KiB.
agora.request.max.bytes=${AGORA_REQUEST_MAX_BYTES:16384}
# The cap of a normalized text in code points: 1..4000, 4000 by default.
agora.text.max.codepoints=${AGORA_TEXT_MAX_CODEPOINTS:4000}
# The cap of a rendered text in UTF-8 bytes: 1..32768, 32768 by default.
agora.rendered.max.bytes=${AGORA_RENDERED_MAX_BYTES:32768}
# The business timezone of the forum.
agora.business.timezone=Europe/Paris

# The test profile exercises the database-backed features, because the disposable test database is
# what those tests are about. A test that wants the database-less boot sets the key to false.
%test.agora.database.enabled=${AGORA_DATABASE_ENABLED:true}

# --- Database ------------------------------------------------------------------------------
# The forum's connection settings. The transition baseline opens a SQLite file; the PostgreSQL
# cutover is a separate gate (knowledge/components/agora-product.md), so the URL, the user and the
# password are configuration the application reads and validates today. A deployment that enables
# the database-backed features must configure a connection: the URL, or the transitional file.
agora.database.url=${AGORA_DATABASE_URL:}
agora.database.user=${AGORA_DATABASE_USER:}
agora.database.password=${AGORA_DATABASE_PASSWORD:}
agora.database.sqlite.path=${AEION_SQLITE_PATH:}

quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.username=${AGORA_DATABASE_USER:}
quarkus.datasource.password=${AGORA_DATABASE_PASSWORD:}
quarkus.datasource.jdbc.url=${AGORA_DATABASE_URL:jdbc:sqlite:${AEION_SQLITE_PATH:/tmp/agora.db}}
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=10s
# The pool opens no connection until one is asked for: a deployment without a database-backed
# feature never asks, so it never connects.
quarkus.datasource.jdbc.initial-size=0
# busy_timeout + WAL are set per connection by the driver URL parameters below.
quarkus.datasource.jdbc.additional-jdbc-properties.busy_timeout=5000
quarkus.datasource.jdbc.additional-jdbc-properties.journal_mode=WAL
quarkus.datasource.jdbc.additional-jdbc-properties.synchronous=NORMAL

quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.schema-management.strategy=none

# --- Migrations -----------------------------------------------------------------------------
# The migration runner is ours (feature 002): a versioned SQL folder, applied in order inside a
# transaction, recorded in schema_migrations. No Flyway module exists for SQLite, and owning the
# runner keeps the schema reproducible in a test with an ephemeral database.
aeion.migrations.location=db/migration

# --- Kafka (feature 011) --------------------------------------------------------------------
# Off by default: a deployment without a broker must still serve readers, and its events wait in the
# outbox. With AEION_KAFKA_ENABLED=true the publisher drains the outbox and the consumer subscribes;
# both use the plain clients, so no connector has to exist for a unit run.
agora.kafka.enabled=${AEION_KAFKA_ENABLED:false}
agora.kafka.bootstrap.servers=${AEION_KAFKA:127.0.0.1:9092}
agora.kafka.topic=agora.threads
agora.kafka.group=agora-forum

%test.quarkus.scheduler.enabled=false
# An ephemeral port keeps a suite from colliding with a forum a human is running.
%test.quarkus.http.test-port=0

quarkus.log.category."local.aeion".level=INFO
