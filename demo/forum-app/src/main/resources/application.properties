# Spec: knowledge/components/agora-product.md
# Agora forum: Quarkus on Java 25, Hibernate over a SQLite database that is deployed separately.
# The database file is owned by the sqlite service (demo/forum-db); the application only opens it
# through a URL that keeps WAL and a busy timeout, never by copying it.

quarkus.application.name=agora-forum
aeion.release=${AEION_RELEASE:unreleased}
quarkus.http.port=${AEION_FORUM_PORT:8081}
quarkus.http.host=127.0.0.1

# --- The forum's web face (React Native for web) --------------------------------------------
# The same client runs in a browser on the Expo dev server; that origin is allowed, with the
# session cookie, and nothing else. The browser owns the cookie and sends it on every call.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://127.0.0.1:8082,http://localhost:8082
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=content-type,accept,x-csrf-token

# --- Settings (feature 001) ----------------------------------------------------------------
# A deployment without a real secret refuses to start (SessionSecret names only the key).
# The value comes from the environment; it is never written to a file, a log or a page.
agora.session.secret=${AGORA_SESSION_SECRET:}
# These are the only other settings the application reads. Each is checked while the process starts
# (ForumSettings + StartupChecks) and a refusal names the key and its bound, never the value that
# was supplied. Anything that is not on this list is not looked up at all, so an unrelated variable
# cannot reach a log line, a page or a decision.
#   AGORA_REQUEST_MAX_BYTES   1..16384 bytes   (the ceiling the request filter accepts)
#   AGORA_TEXT_MAX_CODEPOINTS 1..4000 codepoints
#   AGORA_RENDERED_MAX_BYTES  1..32768 bytes
#   AGORA_BUSINESS_TIMEZONE   a region-based zone id, the product's business calendar
#   AGORA_DATABASE_ENABLED    true or false
agora.request.max.bytes=${AGORA_REQUEST_MAX_BYTES:16384}
agora.text.max.codepoints=${AGORA_TEXT_MAX_CODEPOINTS:4000}
agora.rendered.max.bytes=${AGORA_RENDERED_MAX_BYTES:32768}
agora.business.timezone=${AGORA_BUSINESS_TIMEZONE:Europe/Paris}
# Database-backed features are off unless the operator turns them on, which is what lets a minimal
# deployment boot, answer GET /healthz and hold no connection at all. Turned on, the connection
# settings become required instead of assumed.
agora.database.enabled=${AGORA_DATABASE_ENABLED:false}
# The suite runs against a database created for each test class (QuarkusTestDatabase), so the
# features are on there. A test that wants the database-less boot overrides both names: the
# profile-prefixed one is what answers during a @QuarkusTest run.
%test.agora.database.enabled=true
# Deliberately no default. With database-backed features on, `StartupChecks` refuses an unstated
# connection: this key, or a quarkus.datasource.jdbc.url the operator replaced, states it; the URL
# this file ships for developers does not. The datasource line below stays unchanged, so a deployment
# that states its connection behaves exactly as before. What changed is the case that used to be
# silent: features on and nothing stated is now a startup refusal instead of an application quietly
# opening /tmp/agora.db.
agora.database.connection.url=${AEION_SQLITE_PATH:}
# Request body cap: a 16 KiB ceiling, refused as 413 before any handler runs. It is the maximum the
# AGORA_REQUEST_MAX_BYTES bound allows, and it stays a literal on purpose: the transport reads its
# own ceiling before this application has checked anything, so an out-of-range bound is refused by
# ForumSettings (which names the key) rather than by a config converter (which quotes the value).
quarkus.http.limits.max-body-size=16K

# --- SQLite ---------------------------------------------------------------------------------
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.username=
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:sqlite:${AEION_SQLITE_PATH:/tmp/agora.db}
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=10s
# busy_timeout + WAL are set per connection by the driver URL parameters below.
quarkus.datasource.jdbc.additional-jdbc-properties.busy_timeout=5000
quarkus.datasource.jdbc.additional-jdbc-properties.journal_mode=WAL
quarkus.datasource.jdbc.additional-jdbc-properties.synchronous=NORMAL

quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.schema-management.strategy=none

# --- Migrations -----------------------------------------------------------------------------
# The migration runner is ours (feature 002): a versioned SQL folder, applied in order inside a
# transaction, recorded in schema_migrations. No Flyway module exists for SQLite, and owning the
# runner keeps the schema reproducible in a test with an ephemeral database.
aeion.migrations.location=db/migration

# --- Kafka (feature 011) --------------------------------------------------------------------
# Off by default: a deployment without a broker must still serve readers, and its events wait in the
# outbox. With AEION_KAFKA_ENABLED=true the publisher drains the outbox and the consumer subscribes;
# both use the plain clients, so no connector has to exist for a unit run.
agora.kafka.enabled=${AEION_KAFKA_ENABLED:false}
agora.kafka.bootstrap.servers=${AEION_KAFKA:127.0.0.1:9092}
agora.kafka.topic=agora.threads
agora.kafka.group=agora-forum

%test.quarkus.scheduler.enabled=false
# An ephemeral port keeps a suite from colliding with a forum a human is running.
%test.quarkus.http.test-port=0

quarkus.log.category."local.aeion".level=INFO
